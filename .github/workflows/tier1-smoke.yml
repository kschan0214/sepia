name: Tier 1 smoke test

on:
  push:
    branches: [master, main, dev1.3.0]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Image_Processing_Toolbox

      - name: Run Tier 1 smoke tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            cd(fullfile(getenv('GITHUB_WORKSPACE'),'test','tools'));
            run_tier1;

      - name: Upload TAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-tap-results
          path: test/tools/tier1-results.tap
